<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PSLE Science Sketchnotes, interactive</title>
<style>
:root{--paper:#F7F5EE;--paper2:#EEEBDF;--ink:#262B40;--ink2:#5A6076;--red:#C23B2E;--good:#2A8A55;--bad:#C23B2E;--th:#2E8B7A;--tint:#CDE9E3;
--hand:"Chalkboard SE","Marker Felt","Segoe Print","Bradley Hand","Comic Sans MS","Comic Neue",cursive;
--body:"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
--r:14px 10px 15px 9px/10px 14px 9px 15px}
[data-theme=diversity]{--th:#2E8B7A;--tint:#CDE9E3}
[data-theme=cycles]{--th:#7B4FB3;--tint:#E2D6F2}
[data-theme=systems]{--th:#C8465A;--tint:#F6D4DA}
[data-theme=interactions]{--th:#2F6DB5;--tint:#D2E2F4}
[data-theme=energy]{--th:#B98200;--tint:#F7E7B5}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--body)}
a{color:var(--th)}
:focus-visible{outline:3px solid var(--th);outline-offset:2px}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--paper2);border-right:2px solid var(--ink);padding:18px 14px 40px}
.side h2{font:700 1.2rem/1.2 var(--hand);margin:0 0 10px}
.side .th{margin:16px 0 4px;font:700 1rem var(--hand);color:var(--c)}
.side a{display:flex;gap:6px;align-items:baseline;padding:5px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.92rem}
.side a:hover{background:#ffffffaa}
.side a.on{background:var(--tint);font-weight:600;box-shadow:inset 3px 0 0 var(--th)}
.side a .pg{margin-left:auto;color:var(--ink2);font-size:.76rem;white-space:nowrap;padding-left:6px}
.side a .st{display:inline-block;width:1em;text-align:center;color:var(--good);font-weight:700}
.side a.lock{color:var(--ink2);cursor:default;opacity:.7;text-decoration:line-through;text-decoration-color:#262B4033}
main{min-width:0;padding:0 clamp(14px,4vw,44px) 80px}
.topbar{position:sticky;top:0;z-index:6;background:var(--paper);display:flex;gap:8px;align-items:center;padding:10px 0;border-bottom:2px dashed #262B4044;flex-wrap:wrap}
.topbar .sp{flex:1}
#menu{display:none}
.wrap{max-width:1020px}
.badge{background:var(--th);color:#fff;font:700 .82rem var(--hand);padding:2px 11px;border-radius:999px}
.pgn{margin-left:10px;color:var(--ink2);font-size:.85rem}
.mh{margin-top:22px}
.title{font:700 clamp(2rem,6vw,3.3rem)/1.08 var(--hand);margin:.25em 0 .3em;color:var(--paper);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--th);letter-spacing:.01em}
.lede{font-size:1.08rem;max-width:62ch;margin:0 0 6px}
.card{background:#fff;border:2px solid var(--ink);border-radius:var(--r);box-shadow:4px 4px 0 var(--tint);padding:16px 18px;margin:20px 0}
.card>h2{font:700 1.4rem/1.2 var(--hand);margin:0 0 10px;color:var(--th)}
.card>h2 small{font:500 .85rem var(--body);color:var(--ink2);margin-left:8px}
.note{border:2px dashed var(--ink);border-radius:var(--r);padding:10px 14px;background:#fffc;margin:12px 0}
.muted{color:var(--ink2)}.sm{font-size:.85rem}
.k{color:var(--red);font-weight:600}
.extra{font-size:.66rem;font-weight:700;border:1.5px solid var(--ink2);color:var(--ink2);border-radius:6px;padding:0 4px;margin-left:3px;vertical-align:super;white-space:nowrap}
.ver{background:#FFF0A0;border-radius:4px;padding:0 4px;font-size:.78rem;font-weight:600;white-space:nowrap}
.em{font-size:1.2em;margin-right:.3em}
.go{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.go .btn{text-decoration:none;display:inline-block}
.good{color:var(--good);font-weight:600}.bad{color:var(--bad);font-weight:600}
.btn{font:600 .95rem var(--body);border:2px solid var(--ink);background:#fff;color:var(--ink);padding:7px 16px;border-radius:var(--r);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn.pri{background:var(--th);color:#fff}
.btn.sm{padding:4px 11px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 14px;font:600 .9rem var(--body);cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.scrollx{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;background:#fff}
.t th,.t td{border:2px solid var(--ink);padding:8px 10px;vertical-align:top;text-align:left}
.t th{background:var(--tint)}
ul.pl{margin:6px 0;padding-left:1.2em}
ul.pl li{margin:3px 0}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px;align-items:start}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:#fff;border:2px solid var(--ink);border-radius:var(--r);padding:11px 14px;box-shadow:3px 3px 0 var(--tint)}
.tile:focus-visible{outline:3px solid var(--th);outline-offset:2px}
.tf{display:block;font-weight:700;padding-right:18px;position:relative}
.tf::after{content:'+';position:absolute;right:0;top:0;color:var(--th);font-weight:700}
.tile.open .tf::after{content:'\2212'}
.tb{display:none;margin-top:8px;font-size:.95rem;font-weight:400}
.tile.open .tb{display:block}
.tile.open{background:var(--tint)}
.tiles.wide{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
/* diagram */
.dbody{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(230px,1fr);gap:16px;margin-top:12px}
.art{position:relative;background:#fff;border:2px solid var(--ink);border-radius:var(--r);overflow:hidden}
.art svg{display:block;width:100%;height:100%}
.pin{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:#fff;font:700 .85rem var(--body);color:var(--ink);cursor:pointer;padding:0;display:grid;place-items:center;box-shadow:2px 2px 0 var(--th)}
.pin.on{background:var(--th);color:#fff}
.pin.ok{background:var(--good);color:#fff}
.pin.no{animation:shake .45s}
.pin .pl{display:none;position:absolute;left:40px;top:50%;transform:translateY(-50%);white-space:nowrap;background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:1px 8px;font-size:.8rem;font-weight:600;z-index:2}
.pin.on .pl{display:block}
.panel{background:#fff;border:2px solid var(--ink);border-radius:var(--r);padding:14px 16px;box-shadow:4px 4px 0 var(--tint);align-self:start}
.panel h3{margin:0 0 6px;font:700 1.25rem var(--hand);color:var(--th)}
.tqq{font-size:1.1rem;font-weight:600;margin:4px 0}
.legend{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.legend button{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:3px 10px;font:600 .82rem var(--body);cursor:pointer;color:var(--ink)}
.legend button.on{background:var(--th);color:#fff}
@keyframes shake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(-60%,-50%)}75%{transform:translate(-40%,-50%)}}
/* stepper */
.scene{background:#fff;border:2px solid var(--ink);border-radius:var(--r);overflow:hidden}
.scene svg{display:block;width:100%;height:auto;max-height:430px}
.stxt{margin:12px 0 8px}
.stxt h3{margin:0 0 4px;font:700 1.3rem var(--hand);color:var(--th)}
.snav{display:flex;align-items:center;gap:12px}
.dots{flex:1;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:#fff;cursor:pointer}
.dots i.on{background:var(--th)}.dots i.seen{background:var(--tint)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chips button{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:4px 13px;font:600 .9rem var(--body);cursor:pointer;color:var(--ink)}
.chips button.on{background:var(--th);color:#fff}
/* classify */
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:10px;border:2px dashed var(--ink);border-radius:var(--r);background:#fffa;margin-top:6px}
.chip{display:inline-block;font:500 .92rem var(--body);border:2px solid var(--ink);border-radius:999px;background:#fff;padding:4px 12px;cursor:grab;color:var(--ink);user-select:none}
.chip.sel{background:var(--th);color:#fff}
.chip.ok{cursor:default;background:#E5F4EA;border-color:var(--good);font-size:.85rem}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-top:12px}
.bucket{border:2px solid var(--ink);border-radius:var(--r);background:#fff;padding:8px 10px;min-height:96px;cursor:pointer;box-shadow:3px 3px 0 var(--tint)}
.bucket.over{background:var(--tint)}
.bucket h4{margin:0 0 6px;font:700 1rem var(--hand)}
.bucket p{margin:0 0 6px}
.bucket .in{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.fb{min-height:1.6em;margin-top:10px}
/* quick ask */
.opts{display:grid;gap:8px;margin:10px 0}
.opt{text-align:left;border:2px solid var(--ink);border-radius:var(--r);background:#fff;padding:9px 12px;font:500 .98rem var(--body);cursor:pointer;color:var(--ink)}
.opt.ok{background:#E5F4EA;border-color:var(--good)}
.opt.no{background:#FBE7E4;border-color:var(--bad)}
details.qa{border:2px solid var(--ink);border-radius:var(--r);background:#fff;padding:10px 14px;margin:10px 0}
.qa summary{cursor:pointer;font-weight:600}
.qa .ans{margin-top:8px;padding-top:8px;border-top:2px dashed #262B4033}
/* graph */
.hg{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(220px,1fr);gap:14px;margin-top:10px}
.gsvg{width:100%;height:auto;background:#fff;border:2px solid var(--ink);border-radius:var(--r)}
.gs{stroke:var(--ink)}.gs.on{stroke:var(--th)}
.gh{cursor:pointer;pointer-events:stroke}
.gb{display:flex;align-items:center;gap:12px}
.gb svg{width:84px;height:auto;flex:none}
.temp{font:700 1.7rem var(--hand)}
.gctl{display:flex;gap:10px;align-items:center;margin-top:8px}
/* labs */
.lab{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(220px,1fr);gap:16px;align-items:start}
.ctl{display:grid;gap:10px}
.ctl label{display:grid;gap:2px;font-weight:600;font-size:.92rem}
.ctl input[type=range]{width:100%;accent-color:var(--th)}
/* chrome */
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:34px;flex-wrap:wrap}
.pn a{text-decoration:none}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:8px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:30;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px;margin-top:20px}
.tbox{border:2px dashed var(--ink);border-radius:var(--r);padding:12px 16px;background:#fff;box-shadow:4px 4px 0 var(--tint)}
.tbox h3{margin:0 0 6px;font:700 1.45rem var(--hand);color:var(--th)}
.tbox a{display:flex;gap:6px;padding:3px 0;color:var(--ink);text-decoration:none}
.tbox a:hover{color:var(--th)}
.tbox a .pg{margin-left:auto;color:var(--ink2);font-size:.8rem}
.tbox a.lock{color:var(--ink2);opacity:.65;cursor:default;text-decoration:line-through}
.tbox .st{width:1em;color:var(--good);font-weight:700}
.bar{height:12px;border:2px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden;max-width:360px}
.bar i{display:block;height:100%;background:var(--th)}
.sheet{position:fixed;left:50%;bottom:14px;transform:translate(-50%,140%);width:min(560px,94vw);background:#fff;border:3px solid var(--ink);border-radius:var(--r);box-shadow:5px 5px 0 var(--th,#999);padding:14px 16px;z-index:25;transition:transform .25s;max-height:62vh;overflow:auto}
.sheet.show{transform:translate(-50%,0)}
.sheet li{margin:5px 0}
.map{border:3px solid var(--ink);border-radius:var(--r);overflow:hidden;background:#86C26A;box-shadow:5px 5px 0 var(--tint)}
.stop:focus-visible{outline:none}.stop:focus-visible path{stroke:#C23B2E}
@media(max-width:900px){
 .app{grid-template-columns:1fr}
 .side{position:fixed;left:0;top:0;bottom:0;width:290px;z-index:20;transform:translateX(-102%);transition:transform .2s}
 body.nav-open .side{transform:none;box-shadow:6px 0 0 #262B4033}
 #menu{display:inline-block}
 .dbody,.hg,.lab{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
<nav class="side" id="nav" aria-label="Pages"></nav>
<main>
 <div class="topbar wrap">
  <button class="btn sm" id="menu" type="button" aria-label="Open page list">Pages</button>
  <span class="sp"></span>
  <a class="btn sm" href="#guide" style="text-decoration:none">Start here</a>
  <a class="btn sm" href="#review" style="text-decoration:none">Mistake book <b id="mb2"></b></a>
  <button class="btn sm" id="exp" type="button">Export progress</button>
  <button class="btn sm" id="imp" type="button">Import</button>
  <input type="file" id="impf" accept="application/json" hidden>
 </div>
 <div class="wrap" id="view" tabindex="-1"></div>
</main>
</div>
<script>
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=h=>String(h).replace(/<[^>]+>/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const REDUCED=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
let CUR=null,LEAVE=[];
const onLeave=f=>LEAVE.push(f);
const EMO={'polar bear':'\u{1F43B}\u200D\u2744\uFE0F','arctic fox':'\u{1F98A}','fennec fox':'\u{1F98A}','fox':'\u{1F98A}','elephant':'\u{1F418}','fish':'\u{1F41F}','shark':'\u{1F988}','frog':'\u{1F438}','toad':'\u{1F438}','tadpole':'\u{1F438}','turtle':'\u{1F422}','bee':'\u{1F41D}','butterfly':'\u{1F98B}','moth':'\u{1F98B}','caterpillar':'\u{1F41B}','bird':'\u{1F426}','swallow':'\u{1F426}','pelican':'\u{1F426}','woodpecker':'\u{1F426}','ostrich':'\u{1F426}','jacana':'\u{1F426}','eagle':'\u{1F985}','owl':'\u{1F989}','penguin':'\u{1F427}','chicken':'\u{1F414}','hen':'\u{1F414}','bat':'\u{1F987}','seal':'\u{1F9AD}','walrus':'\u{1F9AD}','squirrel':'\u{1F43F}\uFE0F','camel':'\u{1F42A}','snake':'\u{1F40D}','gerbil':'\u{1F439}','hamster':'\u{1F439}','cactus':'\u{1F335}','cacti':'\u{1F335}','wolf':'\u{1F43A}','tiger':'\u{1F42F}','leopard':'\u{1F406}','chameleon':'\u{1F98E}','lizard':'\u{1F98E}','skink':'\u{1F98E}','squid':'\u{1F991}','porcupine':'\u{1F994}','pangolin':'\u{1F994}','puffer fish':'\u{1F421}','zebra':'\u{1F993}','deer':'\u{1F98C}','dolphin':'\u{1F42C}','whale':'\u{1F40B}','crab':'\u{1F980}','crocodile':'\u{1F40A}','alligator':'\u{1F40A}','mosquito':'\u{1F99F}','spider':'\u{1F577}\uFE0F','beetle':'\u{1FAB2}','kangaroo':'\u{1F998}','koala':'\u{1F428}','duck':'\u{1F986}','beaver':'\u{1F9AB}','otter':'\u{1F9A6}','lion':'\u{1F981}','rabbit':'\u{1F407}','mice':'\u{1F401}','mouse':'\u{1F401}','grasshopper':'\u{1F997}','grains':'\u{1F33E}','grass':'\u{1F33E}','human':'\u{1F9D1}','mushroom':'\u{1F344}','fungus':'\u{1F344}','fungi':'\u{1F344}','bacteria':'\u{1F9A0}','cockroach':'\u{1FAB3}','housefly':'\u{1FAB0}','ladybird':'\u{1F41E}','ant':'\u{1F41C}','snail':'\u{1F40C}','earthworm':'\u{1FAB1}','fern':'\u{1F33F}','flower':'\u{1F338}','flowers':'\u{1F338}','leaves':'\u{1F343}','leaf':'\u{1F343}','seed':'\u{1F331}','seedling':'\u{1F331}','tree':'\u{1F333}','sun':'\u2600\uFE0F','star':'\u2B50','moon':'\u{1F319}','lightning':'\u26A1','candle':'\u{1F56F}\uFE0F','lamp':'\u{1F4A1}','bulb':'\u{1F4A1}','battery':'\u{1F50B}','magnet':'\u{1F9F2}','magnets':'\u{1F9F2}','ice':'\u{1F9CA}','steam':'\u{1F4A8}','wind':'\u{1F32C}\uFE0F','coal':'\u{1FAA8}','wood':'\u{1FAB5}','rain':'\u{1F327}\uFE0F','fire':'\u{1F525}','flood':'\u{1F30A}','drought':'\u{1F3DC}\uFE0F','heart':'\u2764\uFE0F','lungs':'\u{1FAC1}','nose':'\u{1F443}','brain':'\u{1F9E0}','tooth':'\u{1F9B7}','teeth':'\u{1F9B7}','eyes':'\u{1F441}\uFE0F','oil':'\u{1F6E2}\uFE0F','plastic':'\u{1F9F4}','rubber':'\u{1F9E4}','glass':'\u{1F95B}','metal':'\u{1F529}','fabric':'\u{1F9F5}','paper':'\u{1F4C4}','car':'\u{1F697}','train':'\u{1F686}','thermometer':'\u{1F321}\uFE0F','kettle':'\u2615','popsicles':'\u{1F366}','spectacles':'\u{1F453}'};
const EMK=Object.keys(EMO).sort((a,b)=>b.length-a.length).map(k=>[k,new RegExp('\\b'+k+'(s|es)?\\b','i')]);
function emo(t){const p=strip(t);for(const [k,re] of EMK)if(re.test(p))return `<span class="em" aria-hidden="true">${EMO[k]}</span>`;return '';}
const card=(t,inner,extra='')=>`<section class="card"><h2>${t}${extra?`<small>${extra}</small>`:''}</h2>${inner}</section>`;
const X=t=>`<span class="extra" title="Beyond the P3-P6 syllabus wording, kept because the book has it">${t||'extra'}</span>`;
const CHK=t=>`<mark class="ver" title="Photo text was hard to read. Check against the book.">check${t?': '+t:''}</mark>`;
const tiles=(items,o={})=>`<div class="tiles ${o.cls||''}" data-tiles data-goal="${o.goal||'tiles'}">${items.map(t=>`<button type="button" class="tile" aria-expanded="false"><span class="tf">${emo(t.f)}${t.f}</span><span class="tb">${t.b}</span></button>`).join('')}</div>`;
const qa=(q,a)=>`<details class="qa"><summary>${q}</summary><div class="ans">${a}</div></details>`;
const ul=a=>`<ul class="pl">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;

/* ================= store ================= */
const KEY='psle-sketchnotes-v1';
const Store={d:{visited:{},goals:{},misses:[]},
 load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)this.d=Object.assign({visited:{},goals:{},misses:[]},s);}catch(e){}},
 save(){try{localStorage.setItem(KEY,JSON.stringify(this.d));}catch(e){}}};
function isDone(m){const g=Store.d.goals[m.id]||{};return !!(m.goals&&m.goals.length&&m.goals.every(k=>g[k]));}
function goal(key){if(!CUR||!CUR.goals||!CUR.goals.includes(key))return;const was=isDone(CUR);const g=(Store.d.goals[CUR.id]=Store.d.goals[CUR.id]||{});if(g[key])return;g[key]=1;Store.save();refreshNav();if(!was&&isDone(CUR))toast('Page complete: '+CUR.title);}
function miss(q,chosen,correct,why){if(!CUR)return;const k=CUR.id+'|'+q;const L=Store.d.misses;const m=L.find(x=>x.k===k);if(m){m.n++;m.chosen=chosen;}else L.push({k,page:CUR.id,q,chosen,correct,why,n:1});Store.save();refreshNav();}
function toast(t){let d=$('#toast');if(!d){d=document.createElement('div');d.id='toast';d.setAttribute('role','status');document.body.append(d);}d.textContent=t;d.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>d.classList.remove('show'),2300);}

/* ================= component: labelled diagram ================= */
function Diagram(root,cfg){
 const [W,H]=cfg.vb,S=cfg.spots,Y0=cfg.y0||0;const ART=String(cfg.art).replace(/^\s*<svg[^>]*>/,'').replace(/<\/svg>\s*$/,'');let mode='learn',sel=null,order=[],qi=0;
 root.innerHTML=`<div class="diag"><div class="seg"><button type="button" class="on" data-m="learn">Explore</button><button type="button" data-m="test">Test me</button></div><div class="dbody"><div class="art" style="aspect-ratio:${W}/${H}"><svg viewBox="0 ${Y0} ${W} ${H}" role="img" aria-label="${esc(cfg.alt||'Labelled diagram')}">${ART}${S.map(s=>s.tx!=null?`<line x1="${s.x}" y1="${s.y}" x2="${s.tx}" y2="${s.ty}" stroke="${INK}" stroke-width="1.6"/><circle cx="${s.tx}" cy="${s.ty}" r="3.4" fill="${INK}"/>`:'').join('')}</svg>${S.map((s,i)=>`<button type="button" class="pin" data-i="${i}" aria-label="${esc(s.name)}" style="left:${s.x/W*100}%;top:${(s.y-Y0)/H*100}%"><span>${i+1}</span><span class="pl">${esc(s.name)}</span></button>`).join('')}</div><aside class="panel" aria-live="polite"></aside></div></div>`;
 const panel=$('.panel',root),pins=$$('.pin',root);
 const legend=()=>`<ul class="legend">${S.map((s,i)=>`<li><button type="button" data-l="${i}" class="${sel===i?'on':''}">${i+1}. ${esc(s.name)}</button></li>`).join('')}</ul>`;
 function learn(){pins.forEach((p,i)=>{p.className='pin'+(sel===i?' on':'');});panel.innerHTML=(sel==null?`<p>${cfg.intro||'Tap a numbered pin, or pick a name below.'}</p>`:`<h3>${esc(S[sel].name)}</h3><p>${S[sel].fn}</p>`)+legend();}
 function test(msg=''){if(qi>=order.length){panel.innerHTML=`<h3>All ${order.length} found</h3><p>${msg}</p><button type="button" class="btn pri" data-a="again">Test again</button>`;goal(cfg.goal||'diagram');return;}
  const s=S[order[qi]];panel.innerHTML=`<p class="muted">Which part does this describe? Tap it on the diagram.</p><p class="tqq">\u2026${s.fn}</p><p class="muted sm">${qi+1} of ${order.length}</p><div class="fb">${msg}</div>`;}
 function start(){order=shuffle(S.map((_,i)=>i));qi=0;pins.forEach(p=>{p.className='pin';});test();}
 root.addEventListener('click',e=>{
  const mb=e.target.closest('[data-m]');if(mb){mode=mb.dataset.m;$$('[data-m]',root).forEach(b=>b.classList.toggle('on',b===mb));if(mode==='learn'){sel=null;learn();}else start();return;}
  if(e.target.closest('[data-a=again]')){start();return;}
  const lb=e.target.closest('[data-l]');if(lb){sel=+lb.dataset.l;learn();return;}
  const p=e.target.closest('.pin');if(!p)return;const i=+p.dataset.i;
  if(mode==='learn'){sel=i;learn();return;}
  if(qi>=order.length)return;const want=order[qi];
  if(i===want){p.classList.add('ok');qi++;test(`<span class="good">Yes, that is the ${esc(S[i].name)}.</span>`);}
  else{miss('Which part: '+strip(S[want].fn),S[i].name,S[want].name,`${S[i].name}: ${strip(S[i].fn)}`);p.classList.add('no');setTimeout(()=>p.classList.remove('no'),600);test(`<span class="bad">That is the ${esc(S[i].name)}, not this one.</span> <span class="muted">${esc(S[i].name)}: \u2026${S[i].fn}</span> Try again.`);}
 });
 learn();
}

function Stepper(root,cfg){
 const st=cfg.steps,n=st.length;let i=0;const seen=new Set();
 root.innerHTML=`<div class="stp"><div class="scene"></div><div class="stxt"><h3></h3><div class="sb"></div></div><div class="snav"><button type="button" class="btn" data-d="-1">Back</button><div class="dots">${st.map((_,k)=>`<i data-k="${k}" role="button" tabindex="0" aria-label="Step ${k+1}"></i>`).join('')}</div><button type="button" class="btn pri" data-d="1">Next</button></div></div>`;
 function draw(){const s=st[i];const sc=s.scene!==undefined?s.scene:cfg.scene;$('.scene',root).innerHTML=typeof sc==='function'?sc(i):sc;$('h3',root).textContent=s.t;$('.sb',root).innerHTML=s.b;
  $$('.dots i',root).forEach((d,k)=>{d.className=k===i?'on':(seen.has(k)?'seen':'');});seen.add(i);
  $('[data-d="-1"]',root).disabled=i===0;$('[data-d="1"]',root).disabled=i===n-1;if(cfg.onStep)cfg.onStep(i,$('.scene',root));if(i===n-1)goal(cfg.goal||'steps');}
 root.addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b){i=Math.max(0,Math.min(n-1,i+ +b.dataset.d));draw();return;}const d=e.target.closest('.dots i');if(d){i=+d.dataset.k;draw();}});
 root.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&i<n-1){i++;draw();}else if(e.key==='ArrowLeft'&&i>0){i--;draw();}else if((e.key==='Enter'||e.key===' ')&&e.target.matches('.dots i')){i=+e.target.dataset.k;draw();e.preventDefault();}});
 draw();
}

/* ================= component: classify (drag or tap) ================= */
function Classify(root,cfg){
 let items,sel=null,first=0,tried=new Set(),msg='';
 function init(){items=shuffle(cfg.items.map((x,i)=>({...x,id:i,ok:false})));sel=null;first=0;tried=new Set();msg='';draw();}
 function draw(){const left=items.filter(x=>!x.ok);
  root.innerHTML=`<div class="cls"><p class="muted sm">${cfg.prompt||'Drag each card into the right box, or tap a card and then tap a box.'}</p><div class="tray">${left.map(x=>`<span class="chip${sel===x.id?' sel':''}" role="button" tabindex="0" draggable="true" data-id="${x.id}">${emo(x.t)}${esc(x.t)}</span>`).join('')||'<b class="good">All sorted.</b>'}</div><div class="buckets">${cfg.buckets.map((b,bi)=>`<div class="bucket" data-b="${bi}" tabindex="0" role="button" aria-label="Put into ${esc(b.name)}"><h4>${esc(b.name)}</h4>${b.sub?`<p class="muted sm">${b.sub}</p>`:''}<div class="in">${items.filter(x=>x.ok&&x.a===bi).map(x=>`<span class="chip ok">${emo(x.t)}${esc(x.t)}</span>`).join('')}</div></div>`).join('')}</div><div class="fb" aria-live="polite">${msg}</div>${left.length?'':'<button type="button" class="btn" data-r>Shuffle and try again</button>'}</div>`;}
 function place(id,bi){const it=items.find(x=>x.id===id);if(!it||it.ok)return;
  if(it.a===bi){it.ok=true;if(!tried.has(id))first++;sel=null;msg=`<span class="good">Right: ${esc(it.t)} \u2192 ${esc(cfg.buckets[bi].name)}.</span> ${it.why||''}`;
   if(items.every(x=>x.ok)){msg=`<span class="good">All sorted. ${first} of ${items.length} right first time.</span>`;goal(cfg.goal||'game');}}
  else{tried.add(id);miss(it.t,cfg.buckets[bi].name,cfg.buckets[it.a].name,it.why||'');msg=`<span class="bad">Not ${esc(cfg.buckets[bi].name)}.</span> ${it.why||'Look at the clue again.'}`;}
  draw();}
 root.addEventListener('click',e=>{if(e.target.closest('[data-r]')){init();return;}const c=e.target.closest('.tray .chip');if(c){sel=+c.dataset.id;draw();return;}const b=e.target.closest('.bucket');if(b&&sel!=null)place(sel,+b.dataset.b);});
 root.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const c=e.target.closest('.tray .chip');if(c){sel=+c.dataset.id;draw();const nc=$(`.chip[data-id="${sel}"]`,root);if(nc)nc.focus();e.preventDefault();return;}const b=e.target.closest('.bucket');if(b&&sel!=null){place(sel,+b.dataset.b);e.preventDefault();}});
 root.addEventListener('dragstart',e=>{const c=e.target.closest('.chip[data-id]');if(c){sel=+c.dataset.id;e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move';}});
 root.addEventListener('dragover',e=>{const b=e.target.closest('.bucket');if(b){e.preventDefault();b.classList.add('over');}});
 root.addEventListener('dragleave',e=>{const b=e.target.closest('.bucket');if(b)b.classList.remove('over');});
 root.addEventListener('drop',e=>{const b=e.target.closest('.bucket');if(b){e.preventDefault();place(+e.dataTransfer.getData('text/plain'),+b.dataset.b);}});
 init();
}

/* ================= component: quick questions with per-option rationale ================= */
function QuickAsk(root,qs,gk='quiz'){
 let i=0,score=0,wrong=false;
 function draw(){if(i>=qs.length){root.innerHTML=`<div class="qk"><p><b>${score} of ${qs.length}</b> right first time.</p><button type="button" class="btn" data-r>Try again</button></div>`;goal(gk);return;}
  const q=qs[i];wrong=false;root.innerHTML=`<div class="qk"><p class="qq"><b>${i+1}.</b> ${q.q}</p><div class="opts">${q.opts.map((o,k)=>`<button type="button" class="opt" data-k="${k}">${o}</button>`).join('')}</div><div class="fb" aria-live="polite"></div></div>`;}
 root.addEventListener('click',e=>{
  if(e.target.closest('[data-r]')){i=0;score=0;draw();return;}
  if(e.target.closest('[data-n]')){i++;draw();return;}
  const b=e.target.closest('.opt');if(!b||b.disabled||b.classList.contains('no'))return;
  const q=qs[i],k=+b.dataset.k,fb=$('.fb',root),r=q.rat?q.rat[k]:q.why;
  if(k===q.a){b.classList.add('ok');if(!wrong)score++;fb.innerHTML=`<span class="good">Correct.</span> ${r}<div style="margin-top:8px"><button type="button" class="btn pri" data-n>${i<qs.length-1?'Next question':'Finish'}</button></div>`;$$('.opt',root).forEach(o=>{o.disabled=true;});}
  else{b.classList.add('no');if(!wrong)miss(strip(q.q),strip(q.opts[k]),strip(q.opts[q.a]),strip(q.rat?q.rat[k]:q.why));wrong=true;fb.innerHTML=`<span class="bad">Not this one.</span> ${r}`;}
 });
 draw();
}

/* ================= component: cycle diagram (SVG string) ================= */
function wrapText(t,max=14){const w=t.split(' '),lines=[''];w.forEach(x=>{const l=lines[lines.length-1];if((l+' '+x).trim().length>max&&l)lines.push(x);else lines[lines.length-1]=(l+' '+x).trim();});return lines;}
function cycleSVG(nodes,act,edges){
 const W=480,H=350,cx=240,cy=170,n=nodes.length,R=n>4?114:108,r=n>4?29:34,d=(r+7)/R;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cycle diagram"><defs><marker id="ar${n}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="${INK}"/></marker></defs>`;
 for(let i=0;i<n;i++){const a1=(-90+i*360/n)*Math.PI/180,a2=a1+2*Math.PI/n;
  const p1=[cx+R*Math.cos(a1+d),cy+R*Math.sin(a1+d)],p2=[cx+R*Math.cos(a2-d),cy+R*Math.sin(a2-d)];
  s+=`<path d="M${p1[0].toFixed(1)} ${p1[1].toFixed(1)}A${R} ${R} 0 0 1 ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}" fill="none" stroke="${INK}" stroke-width="2" marker-end="url(#ar${n})"/>`;
  if(edges&&edges[i]){const am=a1+Math.PI/n,lx=cx+(R+r+14)*Math.cos(am),ly=cy+(R+r+14)*Math.sin(am);const an=Math.cos(am)>0.3?'start':(Math.cos(am)<-0.3?'end':'middle');
   s+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${an}" font-size="12.5" font-style="italic" fill="#5A6076">${wrapText(edges[i],16).map((l,k)=>`<tspan x="${lx.toFixed(1)}" dy="${k?14:0}">${esc(l)}</tspan>`).join('')}</text>`;}}
 nodes.forEach((nd,i)=>{const a=(-90+i*360/n)*Math.PI/180,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a),on=i===act;
  s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${on?'var(--tint)':'#fff'}" stroke="${on?'var(--th)':INK}" stroke-width="${on?4:2}"/>${ic(nd.icon,x,y,n>4?.85:1)}`;
  const ls=wrapText(nd.label,15);s+=`<text x="${x.toFixed(1)}" y="${(y+r+15).toFixed(1)}" text-anchor="middle" font-size="13" font-weight="${on?700:500}" fill="${on?'var(--th)':INK}">${ls.map((l,k)=>`<tspan x="${x.toFixed(1)}" dy="${k?14:0}">${esc(l)}</tspan>`).join('')}</text>`;});
 return s+'</svg>';
}

/* ================= component: heating/cooling graph ================= */
function beakerSVG(state){
 const cube=(x,y)=>`<rect x="${x}" y="${y}" width="16" height="16" rx="3" fill="#E4F5FC" stroke="#5BA6C9" stroke-width="2"/>`;
 const water=top=>`<rect x="14" y="${top}" width="72" height="${116-top}" fill="#9AD0EE"/>`;
 let c='';
 if(state==='ice')c=cube(20,96)+cube(42,96)+cube(64,96)+cube(30,78)+cube(52,78);
 if(state==='water')c=water(58);

function HeatGraph(root,cfg){
 const W=520,H=300,L=52,R=14,T=14,B=40,P=cfg.pts,n=P.length-1;
 const sx=x=>L+(x-cfg.x[0])/(cfg.x[1]-cfg.x[0])*(W-L-R),sy=y=>H-B-(y-cfg.y[0])/(cfg.y[1]-cfg.y[0])*(H-T-B);
 let cur=0,raf=0,playing=false,t0=0,temp=P[0][1];
 const xt=[];for(let x=cfg.x[0];x<=cfg.x[1];x+=cfg.dx||2)xt.push(x);
 const grid=cfg.yt.map(y=>`<line x1="${L}" x2="${W-R}" y1="${sy(y)}" y2="${sy(y)}" stroke="#262B4022"/><text x="${L-8}" y="${sy(y)+4}" text-anchor="end" font-size="12" fill="#5A6076">${y}</text>`).join('')+xt.map(x=>`<text x="${sx(x)}" y="${H-B+16}" text-anchor="middle" font-size="12" fill="#5A6076">${x}</text>`).join('');
 const segs=P.slice(0,-1).map((p,k)=>{const q=P[k+1],a=`x1="${sx(p[0])}" y1="${sy(p[1])}" x2="${sx(q[0])}" y2="${sy(q[1])}"`;return `<line class="gs" data-k="${k}" ${a} stroke-width="5" stroke-linecap="round"/><line class="gh" data-k="${k}" ${a} stroke="transparent" stroke-width="24"/>`;}).join('');
 const pts=P.map((p,k)=>`<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="4" fill="#fff" stroke="${INK}" stroke-width="2"/><text x="${sx(p[0])+(cfg.dx0?.[k]??-12)}" y="${sy(p[1])+(cfg.dy0?.[k]??-9)}" font-weight="700" font-size="15" stroke="#fff" stroke-width="4" paint-order="stroke" fill="${INK}">${cfg.names[k]}</text>`).join('');
 const marks=(cfg.marks||[]).map(m=>`<text x="${sx(m.x)}" y="${sy(m.y)+m.dy}" font-size="12" font-style="italic" fill="#5A6076" text-anchor="${m.an||'start'}">${m.t}</text>`).join('');
 root.innerHTML=`<div class="hg"><div><svg class="gsvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.alt)}">${grid}<line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="${INK}" stroke-width="2"/><line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="${INK}" stroke-width="2"/><text x="${(L+W-R)/2}" y="${H-4}" text-anchor="middle" font-size="12.5" fill="${INK}">Time (minutes)</text><text transform="translate(13 ${(T+H-B)/2}) rotate(-90)" text-anchor="middle" font-size="12.5" fill="${INK}">Temperature (\u00b0C)</text>${segs}${pts}${marks}<circle class="dot" r="7" fill="var(--th)" stroke="#fff" stroke-width="2"/></svg><div class="gctl"><button type="button" class="btn pri sm" data-p>Play</button><span class="muted sm">Or tap any part of the line.</span></div></div><div class="panel gp" aria-live="polite"></div></div>`;
 const dot=$('.dot',root),panel=$('.gp',root),pb=$('[data-p]',root);
 function setDot(x,y){dot.setAttribute('cx',sx(x));dot.setAttribute('cy',sy(y));}
 function sel(k,x,y,full=true){cur=k;$$('.gs',root).forEach((l,i)=>l.classList.toggle('on',i===k));const s=cfg.secs[k];
  const mx=x??(P[k][0]+P[k+1][0])/2,my=y??(P[k][1]+P[k+1][1])/2;setDot(mx,my);temp=my;
  if(full)panel.innerHTML=`<div class="gb">${beakerSVG(s.state)}<div><div class="temp"><span class="tv">${Math.round(temp)}</span>\u00b0C</div><div class="muted sm">${s.stateLabel}</div></div></div><h3>Section ${cfg.names[k]}${cfg.names[k+1]}</h3><p><b>${s.head}</b></p>${ul(s.pts)}`;
  else{const tv=$('.tv',panel);if(tv)tv.textContent=Math.round(my);}}
 function frame(ts){if(!t0)t0=ts;const dur=11000,f=Math.min(1,(ts-t0)/dur),x=cfg.x[0]+(P[n][0]-cfg.x[0])*f;let k=0;while(k<n-1&&x>P[k+1][0])k++;
  const a=P[k],b=P[k+1],y=a[1]+(b[1]-a[1])*((x-a[0])/(b[0]-a[0]||1));sel(k,x,y,k!==cur||!$('.tv',panel));setDot(x,y);const tv=$('.tv',panel);if(tv)tv.textContent=Math.round(y);
  if(f<1&&playing)raf=requestAnimationFrame(frame);else{playing=false;pb.textContent='Play';goal(cfg.goal||'graph');}}
 pb.addEventListener('click',()=>{if(playing){playing=false;cancelAnimationFrame(raf);pb.textContent='Play';return;}playing=true;t0=0;pb.textContent='Pause';raf=requestAnimationFrame(frame);});
 root.addEventListener('click',e=>{const h=e.target.closest('.gh');if(!h)return;playing=false;cancelAnimationFrame(raf);pb.textContent='Play';sel(+h.dataset.k);goal(cfg.goal||'graph');});
 onLeave(()=>{playing=false;cancelAnimationFrame(raf);});
 sel(0);
}

  secs:[{state:'water',stateLabel:'hot water',head:'Hot water loses heat to the air and cools down.',pts:['Hot water loses heat to the surrounding air, so its temperature decreases.','The beaker contains only water (liquid state).']},

   {state:'water',stateLabel:'water in the freezer',head:'In the freezer, the water cools further.',pts:['The beaker is placed in the freezer. Water loses heat to the cold air.','Its temperature decreases.','The beaker contains only water (liquid state).']},

mod({id:'watercycle',theme:'cycles',pages:'22',title:'The water cycle',goals:['steps','lab','qs'],

render(r){
 r.innerHTML=card('Follow the water','<div id="s"></div>')

 const O={ice:false,flame:false,small:false};const T={ice:'Ice makes the plastic sheet colder, so more vapour loses heat and condenses.',flame:'A higher temperature makes the sea water evaporate faster.',small:'A smaller opening leaves more sea water surface exposed, so it evaporates faster.'};

  s+=`<g class="stop" data-s="${i}" tabindex="0" role="button" aria-label="Stop ${i+1}: ${esc(st.t)}, ${n} of ${m.length} pages done" style="cursor:pointer"><path d="${pts}" fill="${on?'#FFF3B0':'#DCEFF7'}" stroke="${th}" stroke-width="${on?5:4}"/><text x="${x0+(left?24:16)}" y="${py-(lines.length>1?10:2)}" font-size="17" font-weight="800" fill="#1F2E5E">${lines.map((l,k)=>`<tspan x="${x0+(left?24:16)}" dy="${k?19:0}">${esc(l)}</tspan>`).join('')}</text><text x="${x0+(left?24:16)}" y="${py+h/2-8}" font-size="12.5" font-weight="600" fill="#4A5578">p.${st.pg}</text><text x="${x1-(left?32:24)}" y="${py+h/2-8}" text-anchor="end" font-size="13" font-weight="800" fill="${all?'#2A8A55':'#4A5578'}">${all?'done':n+'/'+m.length}</text><circle cx="${px}" cy="${py}" r="26" fill="${all?'#2A8A55':'#fff'}" stroke="${th}" stroke-width="5"/><text x="${px}" y="${py+8}" text-anchor="middle" font-size="22" font-weight="800" fill="${all?'#fff':'#1F2E5E'}">${all?'\u2713':i+1}</text></g>`;});
 // start, finish, title, compass
 s+=`<g><path d="M40 30l40 40M80 30l-40 40" stroke="#C23B2E" stroke-width="9" stroke-linecap="round"/><text x="60" y="98" text-anchor="middle" font-size="13" font-weight="800" fill="#1F2E5E">START</text></g>`;
 s+=`<g transform="translate(380,20)"><path d="M-150 0h300l-16 24 16 24h-300l16-24z" fill="#DCEFF7" stroke="#1F2E5E" stroke-width="3"/><text y="22" text-anchor="middle" font-size="19" font-weight="800" fill="#1F2E5E">PSLE SCIENCE EXPEDITION</text><text y="40" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4A5578">tap a stop to see its pages</text></g>`;
 s+=`<g transform="translate(690,70)"><circle r="40" fill="#FFF3B0" stroke="#1F2E5E" stroke-width="4"/><path d="M0 -36L8 0L0 36L-8 0Z M-36 0L0 -8L36 0L0 8Z" fill="#E8553A" stroke="#1F2E5E" stroke-width="2"/><circle r="12" fill="#fff" stroke="#1F2E5E" stroke-width="2.5"/><text y="6" text-anchor="middle" font-size="16">\u269B\uFE0F</text><g font-size="12" font-weight="800" fill="#1F2E5E" text-anchor="middle"><text y="-44">N</text><text y="56">S</text><text x="52" y="4">E</text><text x="-52" y="4">W</text></g></g>`;
 s+=`<g><path d="M190 2640l40 40M230 2640l-40 40" stroke="#C23B2E" stroke-width="9" stroke-linecap="round"/>${mapEm(300,2700,'\u{1F4B0}',50)}<text x="260" y="2738" text-anchor="middle" font-size="14" font-weight="800" fill="#1F2E5E">YOU MADE IT!</text></g>`;
 return s;}
function mapSVG(sel){return `<svg viewBox="0 0 ${MAPW} ${MAPH}" role="group" aria-label="Route map of the science book" style="width:100%;height:auto;display:block">${mapScenery()}${mapRoute()}${mapStops(sel)}</svg>`;}
function mapInit(root){const box=document.createElement('div');box.className='map';root.append(box);let sel=null;
 const draw=()=>{box.innerHTML=mapSVG(sel);};draw();
 let sh=$('#sheet');if(!sh){sh=document.createElement('div');sh.id='sheet';sh.className='sheet';sh.setAttribute('role','dialog');sh.setAttribute('aria-label','Stop details');document.body.append(sh);}
 const open=i=>{sel=i;const st=MAPSTOPS[i],m=st.m.map(id=>MODS.find(x=>x.id===id)).filter(Boolean),n=m.filter(isDone).length,first=m.find(x=>!isDone(x))||m[0];
  sh.style.setProperty('--th',THEMES[st.th].c);
  sh.innerHTML=`<button type="button" class="btn sm" data-x style="float:right">Close</button><h3 style="margin:0 0 2px;font:700 1.25rem var(--hand);color:${THEMES[st.th].c}">Stop ${i+1}: ${esc(st.t)}</h3><p class="muted sm" style="margin:0 0 8px">${THEMES[st.th].name} theme. ${n} of ${m.length} pages done.</p><ul class="pl" style="list-style:none;padding:0">${m.map(x=>`<li><a href="#${x.id}"><b>${isDone(x)?'\u2713':(Store.d.visited[x.id]?'\u00b7':'\u25CB')}</b> ${x.title} <span class="muted sm">p.${x.pages}</span></a></li>`).join('')}</ul><a class="btn pri" href="#${first.id}" style="text-decoration:none">${n===0?'Start this stop':n===m.length?'Revisit this stop':'Continue this stop'}</a>`;
  sh.classList.add('show');draw();};
 box.addEventListener('click',e=>{const g=e.target.closest('.stop');if(g)open(+g.dataset.s);});
 box.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const g=e.target.closest('.stop');if(g){open(+g.dataset.s);e.preventDefault();$('.stop[data-s="'+g.dataset.s+'"]',box).focus();}});
 sh.addEventListener('click',e=>{if(e.target.closest('[data-x]')){sh.classList.remove('show');sel=null;draw();}});
 onLeave(()=>{sh.classList.remove('show');});}

 +card('On a phone or tablet',ul(['Press <b>Pages</b> (top left) to open the page list.','The diagrams fit the screen. Turn a phone sideways for graphs and labs.']))

 +card('Good to know',ul(['Yellow <mark class="ver">check</mark> tags mark text that was hard to read in the photos. Compare them with the book.','The drawings are simplified redraws, not the book\u2019s artwork. Pages with plain text use small icons instead.','The <a href="#gaps">Gaps and checks</a> page lists everything that is missing or unverified.']));

mod({id:'home',title:'PSLE Science Sketchnotes',
intro:'The sketchnote book, rebuilt so every page can be tapped, sorted, stepped through and tested. Every page from 1 to 73 is in.',
render(r){
 const C=content(),done=C.filter(isDone).length;
 const lastM=MODS.find(x=>x.id===Store.d.last);r.innerHTML=`<div class="go"><a class="btn pri" href="#guide">Start here: how to use this</a><a class="btn" href="#living">Begin at page 2</a>${lastM?`<a class="btn" href="#${lastM.id}">Continue: ${lastM.title}</a>`:''}</div><p><b>${done} of ${C.length}</b> pages complete</p><div class="bar" aria-hidden="true"><i style="width:${C.length?done/C.length*100:0}%"></i></div>`

 +card('Not sure where to start?',`<p>Open <a href="#guide">Start here</a> for a short guide.</p>`)
 +card('How each page works',`<p>Open a page and use whichever of these it offers:</p>${ul(['<b>Tap to reveal</b> cards and numbered pins. In a labelled diagram, switch to <b>Test me</b> and find the part from its job.','<b>Step through</b> a process, such as a life cycle, the water cycle or the path of food.','<b>Drag to sort</b> (or tap a card, then tap a box). A wrong answer explains why and goes into the <b>mistake book</b>.','<b>Graphs and labs</b> you can play with.'])}`);
 mapInit($('#mp',r));

mod({id:'review',title:'Mistake book',
intro:'Everything you placed or answered wrongly, with the reason. Go back to the page, try again, then tick it off.',
render(r){
 const L=Store.d.misses;
 if(!L.length){r.innerHTML=card('Nothing here yet','<p>Wrong answers from the sorting games, quick checks and diagram tests will collect here.</p>');return;}
 const by={};L.forEach(m=>{(by[m.page]=by[m.page]||[]).push(m);});
 r.innerHTML=Object.entries(by).map(([pid,ms])=>{const m=MODS.find(x=>x.id===pid);return card(m?m.title:pid,ms.map(x=>`<div class="note" data-k="${esc(x.k)}"><p><b>${esc(x.q)}</b></p><p class="bad">You chose: ${esc(x.chosen)}</p><p class="good">Answer: ${esc(x.correct)}</p><p>${esc(x.why||'')}</p><p class="muted sm">Missed ${x.n} time${x.n>1?'s':''}.</p><button type="button" class="btn sm" data-ok>Got it, remove</button></div>`).join('')+(m?`<a class="btn sm" href="#${pid}" style="text-decoration:none">Practise this page</a>`:''));}).join('')+`<button type="button" class="btn" id="clr">Clear the whole mistake book</button>`;
 r.addEventListener('click',e=>{const b=e.target.closest('[data-ok]');if(b){const k=b.closest('[data-k]').dataset.k;Store.d.misses=Store.d.misses.filter(x=>x.k!==k);Store.save();show('review');return;}
  if(e.target.closest('#clr')&&confirm('Clear every item in the mistake book?')){Store.d.misses=[];Store.save();show('review');}});
}});

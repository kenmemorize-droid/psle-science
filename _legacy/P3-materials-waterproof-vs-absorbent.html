<title>Waterproof or soaks up water? — P3 Diversity of Materials</title>
<style>
:root[data-theme="notebook"]{
  --bg:#F1E9DA; --paper:#FBF7EF; --card:#FFFDF8; --sunk:#F3EBDC; --topbar:#1F2A37; --topink:#F6EFE2; --topmute:#C9BFAC;

  --accent:#9A6400; --accent-soft:#FBEBCC;
  --ok:#15803D; --ok-soft:#DBF0E2; --no:#B42318; --no-soft:#FAE3E0;
  --line:#D9CFBC; --stroke:#1F2A37; --fa:#D9EDEA; --fb:#FBEBCC; --fc:#E7E0D1;
  --radius:14px; --bw:2px;
  --f-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-label:var(--f-body); --ls:.01em;
}
:root[data-theme="lab"]{
  --bg:#F4F6FA; --paper:#FFFFFF; --card:#FFFFFF; --sunk:#F1F5F9; --topbar:#0F172A; --topink:#F8FAFC; --topmute:#94A3B8;
  --ink:#0F172A; --muted:#64748B;
  --primary:#2563EB; --primary-soft:#DBEAFE; --primary-ink:#FFFFFF;
  --accent:#B45309; --accent-soft:#FEF3C7;
  --ok:#16A34A; --ok-soft:#DCFCE7; --no:#DC2626; --no-soft:#FEE2E2;
  --line:#CBD5E1; --stroke:#0F172A; --fa:#DBEAFE; --fb:#FEF3C7; --fc:#E2E8F0;
  --radius:8px; --bw:1px;
  --f-display:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-label:var(--f-body); --ls:.01em;
}
:root[data-theme="mission"]{
  --bg:#070C16; --paper:#0B1220; --card:#111B2E; --sunk:#0A1120; --topbar:#060B14; --topink:#E2E8F0; --topmute:#94A3B8;
  --ink:#E2E8F0; --muted:#94A3B8;
  --primary:#22D3EE; --primary-soft:#0E3A47; --primary-ink:#06212B;
  --accent:#F472B6; --accent-soft:#3B1130;
  --ok:#34D399; --ok-soft:#0C3A2E; --no:#FB7185; --no-soft:#3B1220;
  --line:#24334B; --stroke:#E2E8F0; --fa:#0E3A47; --fb:#3B1130; --fc:#1B2740;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--f-body)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.24;margin:0}
p{margin:0 0 .6em} p:last-child{margin-bottom:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1040px;margin:0 auto;padding:0 14px}

/* header */
.top{background:var(--topbar);color:var(--topink);padding:12px 0 0}
.top .wrap{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:flex-end;justify-content:space-between}
.brand h1{font-size:25px}
.brand .meta{margin:3px 0 10px;color:var(--topmute);font-size:13.5px;font-family:var(--f-label);letter-spacing:var(--ls)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;justify-content:flex-end}
.tools button,.tools a{background:transparent;border:1px solid var(--topmute);color:var(--topink);border-radius:6px;
  padding:7px 11px;font-size:13px;min-height:38px;display:inline-flex;align-items:center;text-decoration:none}
.tools button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:transparent;border:0;color:var(--topmute);padding:11px 14px;border-radius:8px 8px 0 0;font-size:15px;min-height:44px}
.tab[aria-selected="true"]{background:var(--bg);color:var(--ink);font-weight:700}
.tab .dot{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--accent-soft);
  color:var(--accent);font-size:12px;font-weight:700;line-height:20px;text-align:center}

main{padding:16px 0 28px}
footer{padding:0 0 32px;color:var(--muted);font-size:13.5px}
footer a{color:var(--muted)}

/* stepper */
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.pill{position:relative;width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--card);
  color:var(--ink);font-weight:700;font-size:17px}
.pill i{position:absolute;right:-4px;top:-5px;width:20px;height:20px;border-radius:50%;font-style:normal;font-size:12px;
  line-height:20px;text-align:center;color:#fff}
.pill.cur{box-shadow:0 0 0 3px var(--primary-soft);border-color:var(--primary)}
.pill.first,.pill.recapped{border-color:var(--ok)} .pill.first i,.pill.recapped i{background:var(--ok)}
.pill.recap{border-color:var(--accent);background:var(--accent-soft)} .pill.recap i{background:var(--accent)}
.pill.open{border-color:var(--primary)} .pill.open i{background:var(--primary)}
.legend{font-size:13px;color:var(--muted);margin:6px 0 14px}

/* question */
.q{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:18px}
.q h2{font-size:21px;margin-bottom:6px}
.q h3{font-size:14px;font-family:var(--f-label);letter-spacing:var(--ls);color:var(--muted);margin:0 0 8px;font-weight:600}
.intro{font-size:16.5px}
.banner{border-left:4px solid var(--accent);background:var(--accent-soft);padding:9px 12px;border-radius:0 var(--radius) var(--radius) 0;font-size:15px}
.cols{display:grid;grid-template-columns:1fr;gap:16px;margin-top:14px}
@media(min-width:800px){.cols{grid-template-columns:1.3fr .8fr}}
.stage{background:var(--sunk);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:10px}
.stage svg{display:block;width:100%;height:auto}
.stage-msg{font-size:15px;margin:10px 0 0;min-height:44px}
.shelf{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:84px;min-height:70px;padding:8px 10px;
  border:var(--bw) solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--ink);font-size:14px}
.tile[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.tile b{font-size:16px}
.tile small{color:var(--muted);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{min-height:44px;padding:10px 15px;border:var(--bw) solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--ink);font-size:15px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.small{min-height:38px;padding:6px 11px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:default}
.btn[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.note{font-size:13.5px;color:var(--muted);margin:10px 0 0}

/* log + hints */
.side .box{background:var(--sunk);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.logrow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.logrow:last-child{border-bottom:0}
.logrow b{min-width:4.6em}
.logrow.bad{color:var(--no)} .logrow.good{color:var(--ok)}
.empty{color:var(--muted);font-size:14px}
.hints ol{margin:0 0 8px;padding-left:20px;font-size:14.5px}

/* answer */
.answer{border:0;padding:0;margin:18px 0 0}
.answer legend{font-size:16.5px;font-weight:700;padding:0;margin-bottom:10px}
.scroll{overflow-x:auto}
table.exam{width:100%;border-collapse:collapse;font-size:15.5px}
table.exam th,table.exam td{border:var(--bw) solid var(--line);padding:9px 10px;text-align:center}
table.exam th{background:var(--sunk);font-family:var(--f-label);letter-spacing:var(--ls);font-size:13.5px}
tr.opt{cursor:pointer}
tr.opt td.n{white-space:nowrap}
tr.opt td.n label{padding-left:4px;font-weight:700}
tr.opt.sel td{background:var(--primary-soft)}
tr.opt.right td{background:var(--ok-soft)}
tr.opt.missed td{background:var(--no-soft);opacity:.72}
tr.opt.missed td.n small{display:block;font-size:11.5px;color:var(--no)}
tr.opt.locked{cursor:default}
.lock{font-size:14px;color:var(--muted);margin-top:8px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* feedback */
.fb{margin-top:16px;border:var(--bw) solid var(--line);border-radius:var(--radius);padding:14px}
.fb.good{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--no);background:var(--no-soft)}
.fb h3{font-size:18px;margin-bottom:6px;color:inherit;font-family:var(--f-display);letter-spacing:0}
.fb h4{font-size:15px;margin:14px 0 8px}
.fb .key{border-left:4px solid var(--primary);background:var(--card);padding:9px 12px;border-radius:0 var(--radius) var(--radius) 0}
.optcard{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:11px;margin-bottom:8px;font-size:15px}
.optcard.right{border-color:var(--ok)}
.who{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.tagchip{background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12.5px}
.you{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700}
.lbl{font-family:var(--f-label);letter-spacing:var(--ls);font-weight:700;font-size:13.5px}
.clash{margin:6px 0 0;padding-left:20px;font-size:14.5px}

/* panels */
.panel{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.panel h2{font-size:20px;margin-bottom:10px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.stat{flex:1 1 120px;background:var(--sunk);border:var(--bw) solid var(--line);border-radius:var(--radius);padding:10px;font-size:13px;color:var(--muted)}
.stat b{display:block;font-size:22px;color:var(--ink);font-family:var(--f-display)}
.mist{border-top:var(--bw) solid var(--line);padding-top:10px;margin-top:10px}
.mist:first-of-type{border-top:0;margin-top:0;padding-top:0}
.mist h3{font-size:16px}
.mist .fix{font-size:14.5px;color:var(--muted)}
.mist ul{margin:6px 0 0;padding-left:20px;font-size:14.5px}
.rulecard{border:var(--bw) solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:10px}
.rulecard h3{font-size:16px;margin-bottom:4px}
.beyond{border:var(--bw) dashed var(--accent);border-radius:var(--radius);padding:12px}
.beyond .tagx{display:inline-block;font-family:var(--f-label);letter-spacing:var(--ls);font-size:12px;color:var(--accent);
  background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px;padding:2px 9px;margin-right:8px}

.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--topbar);color:var(--topink);
  padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
.toast.show{opacity:1}

/* svg language */
.ln{fill:none;stroke:var(--stroke);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sl{fill:var(--fc);stroke:var(--stroke);stroke-width:2;stroke-linejoin:round}
.lbl{fill:var(--ink);font-family:var(--f-label);font-size:13px;letter-spacing:var(--ls)}
.lbl.sm{font-size:11.5px;fill:var(--muted)}
.fa{fill:var(--fa)} .fb2{fill:var(--fb)} .fc2{fill:var(--fc)}
.mv{transition:transform .6s ease,opacity .4s ease}
@media(prefers-reduced-motion:reduce){.mv,.toast{transition:none!important}}
@media(max-width:560px){body{font-size:16px} .q{padding:13px} .brand h1{font-size:21px}}
.hot{stroke:var(--primary)!important;stroke-width:3.5!important}
.bar{fill:var(--fa);stroke:var(--stroke);stroke-width:2}
.bar.hi{fill:var(--fb)}
.needrow{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:14.5px}
.needrow .m{font-weight:700;min-width:5.6em}
.needrow.met{color:var(--ok)} .needrow.fail{color:var(--no)}
table.tick{width:100%;border-collapse:collapse;font-size:15px;margin:10px 0 0}
table.tick th,table.tick td{border:var(--bw) solid var(--line);padding:7px 8px;text-align:center}
table.tick th{background:var(--sunk);font-family:var(--f-label);font-size:13px;letter-spacing:var(--ls)}
table.tick td.rowname{text-align:left;font-weight:700}

</style>

<script id="data">
/* ===== PAGE 3: waterproof vs absorbent, and the soaking table ===== */
var PAGE = {
  id: 'P3-materials-waterproof-vs-absorbent',
  title: 'Waterproof, or soaks up water?',
  topic: 'Diversity of Materials',
  level: 'P3 Standard',
  meta: 'Diversity &middot; Diversity of Materials &middot; P3 Standard',
  lo: 'Compare physical properties of materials (waterproof); use data to validate explanations',
  sub: 'Soak each material, work out the water it took in, then answer.',
  prev: { href: 'P3-materials-match-part-to-property.html', label: 'Matching a part to the properties it needs' },
  next: null,
  rules: ''
};

var TAGS = {
  W1: { label: 'Reads the final mass instead of subtracting', fix: 'The mass after soaking includes the material itself. Water absorbed = mass after &minus; mass before. Always subtract before comparing.' },
  W2: { label: 'Mixes up waterproof and absorbent', fix: 'Waterproof means the material does not absorb water, so its mass does not change. A towel must do the opposite: take in as much water as possible.' },
  W3: { label: 'Compares how many times heavier instead of grams', fix: 'The pieces are the same size, so compare the grams of water taken in. Doubling a small mass can still be less water than a smaller jump on a bigger piece.' },
  W4: { label: 'Picks the biggest number in the table', fix: 'The biggest number is usually the final mass of the heaviest material. It answers a different question. Work out your own column first.' },
  W5: { label: 'Misses a variable that must be kept the same', fix: 'Only the type of material changes. Size of the piece, amount of water and soaking time must be kept the same, or the difference in mass could be caused by those instead.' }
};

/* ---- bench ---- */
function gain(m) { return m.after - m.before; }
function beakers(Q, run) {
  var n = Q.materials.length, w = Math.floor(500 / n), inner = w - 22;
  var out = Q.materials.map(function (m, i) {
    var x = 12 + i * w, soaked = !!run.bench.done[m.id];
    var wet = soaked && gain(m) > 0;
    return '<g><path class="ln" d="M' + x + ' 34 v128 h' + inner + ' v-128"/>' +
      '<path class="ln fa" d="M' + (x + 4) + ' 70 h' + (inner - 8) + ' v88 h-' + (inner - 8) + ' z"/>' +
      '<rect class="sl' + (wet ? ' fa' : '') + '" x="' + (x + inner / 2 - 24) + '" y="98" width="48" height="52" rx="3"/>' +
      '<text class="lbl" x="' + (x + inner / 2) + '" y="130" text-anchor="middle">' + m.id + '</text>' +
      '<text class="lbl sm" x="' + (x + inner / 2) + '" y="182" text-anchor="middle">' +
      (soaked ? m.before + ' \u2192 ' + m.after + ' g' : m.before + ' g, not soaked') + '</text></g>';
  }).join('');
  return '<svg viewBox="0 0 520 196" role="img" aria-label="Containers of water holding each material.">' + out + '</svg>';
}
function chart(Q, run, kind) {
  var n = Q.materials.length, w = Math.floor(460 / n);
  var vals = Q.materials.map(function (m) { return kind === 'after' ? m.after : gain(m); });
  var max = Math.max.apply(null, vals) * 1.18 || 1;
  var best = vals.indexOf(Math.max.apply(null, vals));
  var bars = Q.materials.map(function (m, i) {
    var v = vals[i], h = Math.round(v / max * 142), x = 60 + i * w + 8, bw = w - 28;
    return '<rect class="bar' + (i === best ? ' hi' : '') + '" x="' + x + '" y="' + (176 - h) + '" width="' + bw + '" height="' + h + '"/>' +
      '<text class="lbl" x="' + (x + bw / 2) + '" y="' + (176 - h - 7) + '" text-anchor="middle">' + v + ' g</text>' +
      '<text class="lbl" x="' + (x + bw / 2) + '" y="196" text-anchor="middle">' + m.id + '</text>';
  }).join('');
  return '<svg viewBox="0 0 520 210" role="img" aria-label="Bar chart of ' + (kind === 'after' ? 'mass after soaking' : 'water absorbed') + '.">' +
    '<text class="lbl" x="260" y="16" text-anchor="middle">' + (kind === 'after' ? 'Mass after soaking (g)' : 'Water absorbed = after \u2212 before (g)') + '</text>' +
    '<line class="ln" x1="56" y1="176" x2="508" y2="176"/><line class="ln" x1="56" y1="26" x2="56" y2="176"/>' + bars + '</svg>';
}

var BENCH = {
  labLabel: 'Soaking lab',
  logLabel: 'Your readings',
  initRun: function (Q) { return { done: {}, last: null, view: 'lab' }; },
  allDone: function (Q, run) { return Q.materials.every(function (m) { return run.bench.done[m.id]; }); },
  stage: function (Q, run) {
    var v = run.bench.view, svg = (v === 'lab') ? beakers(Q, run) : chart(Q, run, v), msg;
    if (v === 'after') msg = 'This graph answers "which is heaviest now?". Part of each bar is just the material itself.';
    else if (v === 'gain') msg = 'This graph answers "which took in the most water?". It is the one that decides a towel question.';
    else if (!run.bench.last) msg = 'Each piece is the same size, in the same amount of water, for the same 10 minutes. Tap a material to soak it and weigh it again.';
    else {
      var m = run.bench.last, g = gain(m);
      msg = '<b>' + m.id + ':</b> ' + m.before + ' g before, ' + m.after + ' g after. ' + m.after + ' &minus; ' + m.before + ' = <b>' + g + ' g</b> of water went in' +
        (g === 0 ? ', so ' + m.id + ' is <b>waterproof</b>.' : '.');
    }
    return { svg: svg, msg: msg };
  },
  shelf: function (Q, run) {
    return Q.materials.map(function (m) {
      var d = !!run.bench.done[m.id];
      return '<button class="tile" data-act="soak" data-id="' + m.id + '" aria-pressed="' + d + '">' +
        '<b>' + m.id + '</b><span>' + m.before + ' g</span><small>' + (d ? m.after + ' g after' : 'tap to soak') + '</small></button>';
    }).join('');
  },
  prompt: function (Q, run) {
    return BENCH.allDone(Q, run) ? 'All four weighed. Compare them two ways:' : 'Soak and weigh every material to unlock the options.';
  },
  chips: function (Q, run) {
    if (!BENCH.allDone(Q, run)) return '';
    return ['lab', 'after', 'gain'].map(function (k) {
      var lbl = { lab: 'Back to the lab', after: 'Graph: mass after soaking', gain: 'Graph: water absorbed' }[k];
      return '<button class="btn" data-act="view" data-view="' + k + '" aria-pressed="' + (run.bench.view === k) + '">' + lbl + '</button>';
    }).join('');
  },
  handle: function (a, el, Q, run) {
    if (a === 'soak') {
      var m = Q.materials.filter(function (x) { return x.id === el.dataset.id; })[0];
      run.bench.done[m.id] = true; run.bench.last = m; run.bench.view = 'lab'; return true;
    }
    if (a === 'view') { run.bench.view = el.dataset.view; return true; }
    return false;
  },
  log: function (Q, run) {
    var rows = Q.materials.filter(function (m) { return run.bench.done[m.id]; }).map(function (m) {
      var g = gain(m);
      return '<div class="logrow ' + (g === 0 ? 'bad' : 'good') + '"><b>' + m.id + '</b><span>' + m.before + ' g &rarr; ' + m.after + ' g, absorbed <b>' + g + ' g</b>' + (g === 0 ? ' (waterproof)' : '') + '</span></div>';
    });

  });
  var due = QUESTIONS.map(function (Q, i) { return { Q: Q, i: i }; }).filter(function (x) { return status(x.Q.id) === 'recap'; });
  var first = QUESTIONS.filter(function (x) { return status(x.id) === 'first'; }).length;
  var hints = QUESTIONS.reduce(function (s, x) { return s + ((progress[x.id] && progress[x.id].hints) || 0); }, 0);
  var groups = {};
  all.forEach(function (m) { var k = m.tag || 'other'; (groups[k] = groups[k] || []).push(m); });
  var keys = Object.keys(groups).sort(function (a, b) { return groups[b].length - groups[a].length; });
  var body = keys.length ? keys.map(function (k) {
    var t = TAGS[k] || { label: 'Other slip', fix: '' };
    return '<div class="mist"><h3>' + t.label + ' (' + groups[k].length + ' time' + (groups[k].length > 1 ? 's' : '') + ')</h3>' +
      '<p class="fix">' + t.fix + '</p><ul>' + groups[k].map(function (m) {
        return '<li>Question ' + (m.qi + 1) + ', option (' + (m.choice + 1) + '): ' + m.Q.options[m.choice].n.join(' / ') +
          '. <button class="btn small" data-act="redo" data-q="' + m.qi + '">Redo</button></li>';
      }).join('') + '</ul></div>';
  }).join('') : '<p class="empty">No mistakes logged yet. Wrong choices appear here, grouped by the idea behind them.</p>';
  main.innerHTML = '<div class="panel"><h2>Mistake book</h2>' +
    '<div class="stats"><div class="stat"><b>' + first + '</b>right first time</div>' +
    '<div class="stat"><b>' + all.length + '</b>wrong choices</div>' +
    '<div class="stat"><b>' + due.length + '</b>to recap</div>' +
    '<div class="stat"><b>' + hints + '</b>hints used</div></div>' +
    (due.length ? '<p>To recap: ' + due.map(function (x) { return 'Question ' + (x.i + 1); }).join(', ') + '.</p>' +
      '<div class="actions"><button class="btn primary" data-act="redo" data-q="' + due[0].i + '">Recap Question ' + (due[0].i + 1) + '</button></div>'
      : '<p class="empty">Nothing waiting for recap.</p>') + '</div>' +
    '<div class="panel"><h2>Ideas to review</h2>' + body + '</div>';
}
function renderRules() { main.innerHTML = PAGE.rules; }

/* ----- events ----- */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]'); 
  if (el) {
    var a = el.dataset.act;
    if (a === 'tab') { view = el.dataset.view; render(); window.scrollTo(0, 0); return; }
    if (a === 'goto') { cur = +el.dataset.q; view = 'questions'; render(); window.scrollTo(0, 0); return; }
    if (a === 'redo') { cur = +el.dataset.q; delete runs[QUESTIONS[cur].id]; view = 'questions'; render(); window.scrollTo(0, 0); return; }
    if (a === 'next') { if (cur < QUESTIONS.length - 1) cur++; render(); window.scrollTo(0, 0); return; }
    if (a === 'hint') {
      var Qh = q(), rh = getRun(Qh), ph = getProg(Qh.id);
      if (rh.hints < Qh.hints.length) { rh.hints++; ph.hints = (ph.hints || 0) + 1; saveProgress(); renderHints(); }
      return;
    }
    if (a === 'check') { checkAnswer(); return; }
    if (a === 'theme') {
      document.documentElement.setAttribute('data-theme', el.dataset.theme);
      try { localStorage.setItem('psle-sci:theme', JSON.stringify(el.dataset.theme)); } catch (err) {}
      paintTheme(); return;
    }
    var Qb = q(), rb = getRun(Qb);
    if (BENCH.handle && BENCH.handle(a, el, Qb, rb)) { paintBench(); renderAnswer(); return; }
  }
  var row = e.target.closest('tr.opt');
  if (row && !row.classList.contains('locked')) selectOption(+row.dataset.i);
});

function paintTheme() {
  var cu = document.documentElement.getAttribute('data-theme');
  [].forEach.call(document.querySelectorAll('[data-act="theme"]'), function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.theme === cu));
  });
}
(function () {
  var t = 'notebook';
  try { var s = localStorage.getItem('psle-sci:theme'); if (s) t = JSON.parse(s); } catch (e) {}
  if (['notebook', 'lab', 'mission'].indexOf(t) < 0) t = 'notebook';
  document.documentElement.setAttribute('data-theme', t);
})();

function boot() {
  main = $('#main');
  $('#btnExport').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify({ app: 'psle-science', page: PAGE.id, exportedAt: new Date().toISOString(), progress: progress }, null, 2)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = PAGE.id + '-progress.json'; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000); toast('Progress exported.');
  });
  $('#btnImport').addEventListener('click', function () { $('#fileImport').click(); });
  $('#fileImport').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        if (d.app !== 'psle-science' || d.page !== PAGE.id || typeof d.progress !== 'object' || !d.progress) throw 0;
        progress = d.progress; runs = {}; saveProgress(); toast('Progress imported.'); render();
      } catch (err) { toast('That file is not a progress export from this page.'); }
    };
    r.readAsText(f); e.target.value = '';
  });
  $('#btnReset').addEventListener('click', function () {
    if (confirm('Clear the progress and mistake book for this page in this browser?')) {
      progress = {}; runs = {}; saveProgress(); cur = 0; view = 'questions'; render(); toast('Progress cleared.');
    }
  });
  $('#brandTitle').textContent = PAGE.title;
  $('#brandMeta').innerHTML = PAGE.meta;
  $('#brandSub').textContent = PAGE.sub;
  var links = '';
  if (PAGE.prev) links += '<a href="' + PAGE.prev.href + '">&#8592; ' + PAGE.prev.label + '</a>';
  if (PAGE.prev && PAGE.next) links += ' &nbsp;&middot;&nbsp; ';
  if (PAGE.next) links += '<a href="' + PAGE.next.href + '">' + PAGE.next.label + ' &#8594;</a>';
  $('#foot').innerHTML = '<p><b>Learning outcome.</b> ' + PAGE.lo + '. Question 1 follows the school paper; the rest are variants on the same idea.</p>' +
    '<p>Progress is saved in this browser only. Use Export to keep a copy.</p>' + (links ? '<p>' + links + '</p>' : '');
  paintTheme(); render();
}
document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
